<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器 - 工具箱</title>
    <meta name="description" content="免费的在线密码生成工具，生成高强度随机密码，支持自定义长度和字符类型，实时检测密码强度。">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <a href="../index.html" class="logo">
                <div class="logo-icon">🧰</div>
                <span>工具箱</span>
            </a>
            <nav class="nav-links">
                <a href="../index.html">← 返回首页</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="tool-page">
            <div class="tool-header">
                <h1>🔐 密码生成器</h1>
                <p>生成高强度随机密码，保护您的账户安全</p>
            </div>

            <div class="card">
                <div class="form-group">
                    <label for="pw-length">密码长度 <span class="slider-value" id="length-value">16</span></label>
                    <input type="range" id="pw-length" min="6" max="32" value="16">
                </div>

                <div class="form-group">
                    <label>字符类型</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" id="use-lower" checked>
                            <span>小写字母 (a-z)</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="use-upper" checked>
                            <span>大写字母 (A-Z)</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="use-number" checked>
                            <span>数字 (0-9)</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="use-symbol">
                            <span>特殊符号 (!@#$)</span>
                        </label>
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" onclick="generatePasswordAction()">生成密码</button>
                    <button class="btn btn-secondary" onclick="copyPassword()">复制密码</button>
                </div>

                <div class="result-box" id="password-result" style="font-size: 1.5rem; text-align: center; letter-spacing: 2px;"></div>

                <div class="strength-bar">
                    <div class="strength-bar-fill" id="strength-fill"></div>
                </div>
                <div class="strength-text" id="strength-text"></div>
            </div>

            <div class="usage-info">
                <h3>使用说明</h3>
                <ul>
                    <li>拖动滑块选择密码长度（6-32位）</li>
                    <li>勾选需要的字符类型（建议至少选择3种）</li>
                    <li>点击「生成密码」生成随机密码</li>
                    <li>密码强度条会显示当前密码的安全等级</li>
                    <li>点击「复制密码」快速复制到剪贴板</li>
                </ul>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© <span id="current-year"></span> 工具箱 - 免费在线工具集合</p>
    </footer>

    <script src="../js/common.js"></script>
    <script>
        const lengthSlider = document.getElementById('pw-length');
        const lengthValue = document.getElementById('length-value');

        lengthSlider.addEventListener('input', function() {
            lengthValue.textContent = this.value;
        });

        function generatePasswordAction() {
            const length = parseInt(lengthSlider.value);
            const options = {
                lower: document.getElementById('use-lower').checked,
                upper: document.getElementById('use-upper').checked,
                number: document.getElementById('use-number').checked,
                symbol: document.getElementById('use-symbol').checked
            };

            if (!options.lower && !options.upper && !options.number && !options.symbol) {
                showMessage('请至少选择一种字符类型', 'error');
                return;
            }

            const password = generatePassword(length, options);
            const resultDiv = document.getElementById('password-result');
            resultDiv.textContent = password;

            const strength = checkPasswordStrength(password);
            const fill = document.getElementById('strength-fill');
            const text = document.getElementById('strength-text');

            fill.className = 'strength-bar-fill strength-' + strength;
            const strengthMap = { weak: '弱', medium: '中', strong: '强' };
            const colorMap = { weak: '#ea4335', medium: '#fbbc04', strong: '#34a853' };
            text.textContent = '密码强度：' + strengthMap[strength];
            text.style.color = colorMap[strength];
        }

        function copyPassword() {
            const password = document.getElementById('password-result').textContent;
            if (!password) {
                showMessage('请先生成密码', 'error');
                return;
            }
            copyToClipboard(password);
        }

        // 页面加载时生成一个默认密码
        document.addEventListener('DOMContentLoaded', generatePasswordAction);
    </script>
</body>
</html>
