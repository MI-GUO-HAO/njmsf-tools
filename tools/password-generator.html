</head>

        <a href="../index.html" class="nav-link">首页</a>
        <div class="dropdown">

          <div class="dropdown-menu">

            <a href="base64.html" class="dropdown-item">&#128220; Base64编解码</a>

            <a href="markdown-editor.html" class="dropdown-item">&#9997; Markdown编辑器</a>

          </div>

      <button class="mobile-menu-btn" onclick="alert('请使用桌面端访问')">&#9776;</button>

  </nav>

  <main>
    <div class="breadcrumb">
      <a href="../index.html">首页</a>
      <span class="breadcrumb-separator">&gt;</span>
      <span>密码生成器</span>
    </div>

    <div class="page-header">
      <h1><div class="tool-icon">&#128273;</div>密码生成器</h1>
      <p>自定义长度和字符类型，生成高强度随机密码</p>
    </div>

    <div class="tool-container">
      <div class="tool-section">
        <label for="pwdLength">密码长度: <span id="lengthValue">16</span></label>
        <input type="range" id="pwdLength" min="4" max="64" value="16" oninput="updateLength(this.value)" style="width:100%;">
      </div>

      <div class="tool-section">
        <div class="checkbox-group">
          <label><input type="checkbox" id="useUpper" checked> 大写字母 (A-Z)</label>
          <label><input type="checkbox" id="useLower" checked> 小写字母 (a-z)</label>
          <label><input type="checkbox" id="useNumber" checked> 数字 (0-9)</label>
          <label><input type="checkbox" id="useSymbol" checked> 特殊符号 (!@#$...)</label>
        </div>
      </div>

      <div class="tool-section">
        <div class="btn-group">
          <button class="btn btn-primary" onclick="generatePassword()">&#128260; 生成密码</button>
          <button class="btn btn-success" onclick="copyPassword()">&#128203; 复制密码</button>
        </div>
      </div>

      <div class="tool-section" id="resultSection" style="display:none;">
        <div class="tool-section-title">生成的密码</div>
        <div class="result-box" id="passwordResult" style="font-size:1.2rem; text-align:center; padding:1.5rem;"></div>
        <div style="margin-top:0.5rem;">
          <div style="display:flex;justify-content:space-between;margin-bottom:0.25rem;">
            <span style="color:var(--text-secondary);font-size:0.85rem;">密码强度</span>
            <span id="strengthText" style="font-size:0.85rem;"></span>
          </div>
          <div class="progress-bar">
            <div id="strengthBar" class="progress-fill" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="related-tools">
      <h3>&#128161; 相关工具推荐</h3>
      <div class="related-tools-grid">
        <a href="base64.html" class="related-tool-item">
          <div class="related-tool-icon">&#128220;</div>
          <span>Base64编解码</span>
        </a>
        <a href="url-encoder.html" class="related-tool-item">
          <div class="related-tool-icon">&#128279;</div>
          <span>URL编解码</span>
        </a>
        <a href="text-tools.html" class="related-tool-item">
          <div class="related-tool-icon">&#128221;</div>
          <span>文本工具</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>在线工具箱 - 纯前端实现，数据不上传服务器 | <a href="../about.html">关于我们</a></p>
  </footer>

  <script>
    function updateLength(val) {
      document.getElementById('lengthValue').textContent = val;
    }

    function generatePassword() {
      const length = parseInt(document.getElementById('pwdLength').value);
      const useUpper = document.getElementById('useUpper').checked;
      const useLower = document.getElementById('useLower').checked;
      const useNumber = document.getElementById('useNumber').checked;
      const useSymbol = document.getElementById('useSymbol').checked;

      const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const lower = 'abcdefghijklmnopqrstuvwxyz';
      const number = '0123456789';
      const symbol = '!@#$%^&*()_+-=[]{}|;:,.<>?';

      let chars = '';
      if (useUpper) chars += upper;
      if (useLower) chars += lower;
      if (useNumber) chars += number;
      if (useSymbol) chars += symbol;

      if (!chars) {
        alert('请至少选择一种字符类型');
        return;
      }

      let password = '';
      const array = new Uint32Array(length);
      window.crypto.getRandomValues(array);
      for (let i = 0; i < length; i++) {
        password += chars[array[i] % chars.length];
      }

      document.getElementById('passwordResult').textContent = password;
      document.getElementById('resultSection').style.display = 'block';
      evaluateStrength(password);
    }

    function evaluateStrength(password) {
      let score = 0;
      if (password.length >= 8) score += 20;
      if (password.length >= 12) score += 10;
      if (password.length >= 16) score += 10;
      if (/[A-Z]/.test(password)) score += 15;
      if (/[a-z]/.test(password)) score += 15;
      if (/[0-9]/.test(password)) score += 15;
      if (/[^A-Za-z0-9]/.test(password)) score += 15;

      const bar = document.getElementById('strengthBar');
      const text = document.getElementById('strengthText');
      bar.style.width = score + '%';

      if (score < 40) {
        bar.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
        text.textContent = '弱';
        text.style.color = '#ef4444';
      } else if (score < 70) {
        bar.style.background = 'linear-gradient(90deg, #f59e0b, #d97706)';
        text.textContent = '中';
        text.style.color = '#f59e0b';
      } else {
        bar.style.background = 'linear-gradient(90deg, #22c55e, #16a34a)';
        text.textContent = '强';
        text.style.color = '#22c55e';
      }
    }

    async function copyPassword() {
      const text = document.getElementById('passwordResult').textContent;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        alert('密码已复制到剪贴板');
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        alert('密码已复制到剪贴板');
      }
    }

    window.addEventListener('load', generatePassword);
  </script>
</body>
</html>
