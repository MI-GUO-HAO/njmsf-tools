<body>

    <div class="nav-container">
      <a href="../index.html" class="logo">

  <main>
    <div class="breadcrumb">
      <a href="../index.html">首页</a>
      <span class="breadcrumb-separator">&gt;</span>
      <span>文本去重排序</span>
    </div>

    <div class="page-header">
      <h1><div class="tool-icon">&#128221;</div>文本去重排序</h1>
      <p>多行文本去重、排序、统计行数</p>
    </div>

    <div class="tool-container">
      <div class="tool-section">
        <label for="textInput">输入文本（每行一条）</label>
        <textarea id="textInput" rows="10" placeholder="每行输入一条内容...&#10;例如：&#10;苹果&#10;香蕉&#10;苹果&#10;橙子"></textarea>
      </div>

      <div class="tool-section">
        <div class="checkbox-group">
          <label><input type="checkbox" id="removeDuplicate" checked> 去重</label>
          <label><input type="checkbox" id="sortAsc"> 升序排序</label>
          <label><input type="checkbox" id="sortDesc"> 降序排序</label>
          <label><input type="checkbox" id="trimSpace" checked> 去除首尾空格</label>
          <label><input type="checkbox" id="removeEmpty" checked> 去除空行</label>
        </div>
      </div>

      <div class="tool-section">
        <div class="btn-group">
          <button class="btn btn-primary" onclick="processText()">&#128260; 处理文本</button>
          <button class="btn btn-success" onclick="copyResult()">&#128203; 复制结果</button>
          <button class="btn btn-secondary" onclick="clearAll()">&#10060; 清空</button>
        </div>
      </div>

      <div class="tool-section" id="statsSection" style="display:none;">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value" id="originalLines">0</div>
            <div class="stat-label">原始行数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="resultLines">0</div>
            <div class="stat-label">结果行数</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="removedLines">0</div>
            <div class="stat-label">去重/移除</div>
          </div>
        </div>
      </div>

      <div class="tool-section" id="resultSection" style="display:none;">
        <div class="tool-section-title">处理结果</div>
        <textarea id="textResult" rows="10" readonly></textarea>
      </div>
    </div>

    <div class="related-tools">
      <h3>&#128161; 相关工具推荐</h3>
      <div class="related-tools-grid">
        <a href="word-counter.html" class="related-tool-item">
          <div class="related-tool-icon">&#9998;</div>
          <span>字数统计</span>
        </a>
        <a href="json-formatter.html" class="related-tool-item">
          <div class="related-tool-icon">&#128203;</div>
          <span>JSON格式化</span>
        </a>
        <a href="base64.html" class="related-tool-item">
          <div class="related-tool-icon">&#128220;</div>
          <span>Base64编解码</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>在线工具箱 - 纯前端实现，数据不上传服务器 | <a href="../about.html">关于我们</a></p>
  </footer>

  <script>
    function processText() {
      let input = document.getElementById('textInput').value;
      if (!input.trim()) {
        alert('请输入文本');
        return;
      }

      let lines = input.split('\n');
      const originalCount = lines.length;

      if (document.getElementById('trimSpace').checked) {
        lines = lines.map(l => l.trim());
      }

      if (document.getElementById('removeEmpty').checked) {
        lines = lines.filter(l => l.length > 0);
      }

      if (document.getElementById('removeDuplicate').checked) {
        lines = [...new Set(lines)];
      }

      if (document.getElementById('sortAsc').checked) {
        lines.sort((a, b) => a.localeCompare(b, 'zh-CN'));
      } else if (document.getElementById('sortDesc').checked) {
        lines.sort((a, b) => b.localeCompare(a, 'zh-CN'));
      }

      const result = lines.join('\n');
      document.getElementById('textResult').value = result;
      document.getElementById('resultSection').style.display = 'block';
      document.getElementById('statsSection').style.display = 'block';

      document.getElementById('originalLines').textContent = originalCount;
      document.getElementById('resultLines').textContent = lines.length;
      document.getElementById('removedLines').textContent = originalCount - lines.length;
    }

    async function copyResult() {
      const text = document.getElementById('textResult').value;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        alert('已复制到剪贴板');
      } catch (e) {
        alert('复制失败');
      }
    }

    function clearAll() {
      document.getElementById('textInput').value = '';
      document.getElementById('textResult').value = '';
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('statsSection').style.display = 'none';
    }
  </script>
</body>
