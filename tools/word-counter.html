  <main>
    <div class="breadcrumb">
      <a href="../index.html">首页</a>
      <span class="breadcrumb-separator">&gt;</span>
      <span>字数统计</span>
    </div>

    <div class="page-header">
      <h1><div class="tool-icon">&#9998;</div>字数统计</h1>
      <p>统计字数、字符数、行数、段落数，分析关键词频率</p>
    </div>

    <div class="tool-container">
      <div class="tool-section">
        <label for="textInput">输入文本</label>
        <textarea id="textInput" rows="12" placeholder="在此粘贴或输入文本..." oninput="analyze()"></textarea>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="totalChars">0</div>
          <div class="stat-label">总字符数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="chineseChars">0</div>
          <div class="stat-label">中文字符</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="wordCount">0</div>
          <div class="stat-label">词数（含中文）</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="lineCount">0</div>
          <div class="stat-label">行数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="paragraphCount">0</div>
          <div class="stat-label">段落数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="spaceCount">0</div>
          <div class="stat-label">空格数</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="punctuationCount">0</div>
          <div class="stat-label">标点符号</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="readingTime">0秒</div>
          <div class="stat-label">预计阅读时间</div>
        </div>
      </div>

      <div class="tool-section" id="freqSection" style="display:none;">
        <div class="tool-section-title">高频词汇（出现2次以上）</div>
        <div class="result-box" id="freqResult"></div>
      </div>
    </div>

      <h3>&#128161; 相关工具推荐</h3>

        <a href="json-formatter.html" class="related-tool-item">

  </main>

  <footer class="footer">
    <p>在线工具箱 - 纯前端实现，数据不上传服务器 | <a href="../about.html">关于我们</a></p>
  </footer>

  <script>
    function analyze() {
      const text = document.getElementById('textInput').value;
      const totalChars = text.length;
      const chineseChars = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
      const lines = text.length === 0 ? 0 : text.split('\n').length;
      const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0).length;
      const spaceCount = (text.match(/\s/g) || []).length;
      const punctuationCount = (text.match(/[\u3000-\u303f\uff00-\uffef\u2000-\u206f\u0021-\u002f\u003a-\u0040\u005b-\u0060\u007b-\u007e]/g) || []).length;
      const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
      const wordCount = chineseChars + words;
      const readingSeconds = Math.ceil(wordCount / 5);
      const readingTime = readingSeconds < 60 ? readingSeconds + '秒' : Math.ceil(readingSeconds/60) + '分钟';

      document.getElementById('totalChars').textContent = totalChars;
      document.getElementById('chineseChars').textContent = chineseChars;
      document.getElementById('wordCount').textContent = wordCount;
      document.getElementById('lineCount').textContent = lines;
      document.getElementById('paragraphCount').textContent = paragraphs;
      document.getElementById('spaceCount').textContent = spaceCount;
      document.getElementById('punctuationCount').textContent = punctuationCount;
      document.getElementById('readingTime').textContent = readingTime;

      // 频率分析
      const freq = {};
      const tokens = text.toLowerCase().match(/[\u4e00-\u9fa5]+|[a-z]+/g) || [];
      tokens.forEach(t => { if (t.length > 1) freq[t] = (freq[t] || 0) + 1; });
      const sorted = Object.entries(freq).filter(([_,c]) => c >= 2).sort((a,b) => b[1]-a[1]).slice(0,20);
      if (sorted.length > 0) {
        document.getElementById('freqResult').innerHTML = '<pre>' + sorted.map(([w,c]) => w + ': ' + c + '次').join('\n') + '</pre>';
        document.getElementById('freqSection').style.display = 'block';
      } else {
        document.getElementById('freqSection').style.display = 'none';
      }
    }
  </script>
</body>
