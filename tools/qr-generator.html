<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="免费在线二维码生成器，支持文本和URL生成二维码图片，可下载保存">
  <title>二维码生成器 - 在线工具箱</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="../index.html" class="logo">
        <div class="logo-icon">&#128295;</div>
        <span>在线工具箱</span>
      </a>
      <div class="nav-links">
        <a href="../index.html" class="nav-link">首页</a>
        <div class="dropdown">
          <button class="dropdown-toggle">工具列表 &#9662;</button>
          <div class="dropdown-menu">
            <a href="qr-generator.html" class="dropdown-item">&#128281; 二维码生成器</a>
            <a href="password-generator.html" class="dropdown-item">&#128273; 密码生成器</a>
            <a href="json-formatter.html" class="dropdown-item">&#128203; JSON格式化</a>
            <a href="text-tools.html" class="dropdown-item">&#128221; 文本去重排序</a>
            <a href="color-converter.html" class="dropdown-item">&#127912; 颜色转换器</a>
            <a href="timestamp-converter.html" class="dropdown-item">&#128336; 时间戳转换</a>
            <a href="base64.html" class="dropdown-item">&#128220; Base64编解码</a>
            <a href="url-encoder.html" class="dropdown-item">&#128279; URL编解码</a>
            <a href="markdown-editor.html" class="dropdown-item">&#9997; Markdown编辑器</a>
            <a href="word-counter.html" class="dropdown-item">&#9998; 字数统计</a>
          </div>
        </div>
        <a href="../about.html" class="nav-link">关于</a>
      </div>
      <button class="mobile-menu-btn" onclick="alert('请使用桌面端访问')">&#9776;</button>
    </div>
  </nav>

  <main>
    <div class="breadcrumb">
      <a href="../index.html">首页</a>
      <span class="breadcrumb-separator">&gt;</span>
      <span>二维码生成器</span>
    </div>

    <div class="page-header">
      <h1><div class="tool-icon">&#128281;</div>二维码生成器</h1>
      <p>输入文本或URL，快速生成二维码图片</p>
    </div>

    <div class="tool-container">
      <div class="tool-section">
        <label for="qrText">输入内容</label>
        <textarea id="qrText" rows="3" placeholder="输入文本、URL或任意内容...">https://example.com</textarea>
      </div>

      <div class="tool-section">
        <div class="btn-group">
          <button class="btn btn-primary" onclick="generateQR()">&#128260; 生成二维码</button>
          <button class="btn btn-secondary" onclick="clearInput()">&#10060; 清空</button>
        </div>
      </div>

      <div id="qrResult" class="tool-section" style="display:none;">
        <div class="tool-section-title">生成的二维码</div>
        <div id="qrcode" style="margin-bottom:1rem;"></div>
        <div class="btn-group">
          <a id="downloadLink" class="btn btn-success" download="qrcode.png">&#128229; 下载图片</a>
        </div>
      </div>
    </div>

    <div class="related-tools">
      <h3>&#128161; 相关工具推荐</h3>
      <div class="related-tools-grid">
        <a href="url-encoder.html" class="related-tool-item">
          <div class="related-tool-icon">&#128279;</div>
          <span>URL编解码</span>
        </a>
        <a href="base64.html" class="related-tool-item">
          <div class="related-tool-icon">&#128220;</div>
          <span>Base64编解码</span>
        </a>
        <a href="text-tools.html" class="related-tool-item">
          <div class="related-tool-icon">&#128221;</div>
          <span>文本工具</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>在线工具箱 - 纯前端实现，数据不上传服务器 | <a href="../about.html">关于我们</a></p>
  </footer>

  <script>
    let currentQR = null;

    function generateQR() {
      const text = document.getElementById('qrText').value.trim();
      if (!text) {
        alert('请输入内容');
        return;
      }

      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      document.getElementById('qrResult').style.display = 'block';

      currentQR = new QRCode(container, {
        text: text,
        width: 200,
        height: 200,
        colorDark: '#0f172a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });

      // 延迟获取canvas并设置下载链接
      setTimeout(() => {
        const img = container.querySelector('img');
        if (img && img.src) {
          document.getElementById('downloadLink').href = img.src;
        } else {
          const canvas = container.querySelector('canvas');
          if (canvas) {
            document.getElementById('downloadLink').href = canvas.toDataURL('image/png');
          }
        }
      }, 300);
    }

    function clearInput() {
      document.getElementById('qrText').value = '';
      document.getElementById('qrcode').innerHTML = '';
      document.getElementById('qrResult').style.display = 'none';
    }

    // 页面加载时自动生成示例
    window.addEventListener('load', generateQR);
  </script>
</body>
</html>
